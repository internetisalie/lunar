# Read by `loom-cli pr land` from the PR's base branch.
profile:
  project:
    name: lunar
    repository: lunar/lunar
    subPath: ""
  repository:
    forge:
      identities:
        implementer:
          login: lunar-agent-implementer
      merge:
        method: squash
        deleteBranch: true
dialect:
  identity:
    pattern: '^(BUG)-[0-9]{3}$'
