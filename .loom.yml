# Read by `loom-cli pr land` from the PR's base branch.
profile:
  project:
    name: lunar
    repository: lunar/lunar
    subPath: ""
  repository:
    forge:
      identities:
        implementer:
          login: lunar-agent-implementer
      merge:
        method: squash
        deleteBranch: true
dialect:
  identity:
    pattern: '^(AI|ANALYSIS|BUG|COMP|DEBUG|DOC|EDITOR|FORMAT|INSP|INTENT|MAINT|NAV|REDIS|REFACT|ROCKS|RUN|SCHEMA|SYNTAX|TARGET|TOOL|TOOLING|TYPE)-[0-9]+$'
