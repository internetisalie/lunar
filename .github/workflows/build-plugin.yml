name: Build Plugin

# GitHub Actions variant of the build/test/release pipeline.
#
# This is the GitHub-native counterpart to .gitea/workflows/build-plugin.yml. GitHub only reads
# .github/workflows, and Gitea's act_runner prefers .gitea/workflows (falling back to .github only
# when .gitea is absent), so each platform runs exactly one copy — no overlap.
#
# Differences from the Gitea variant, all forced by platform incompatibilities:
#   - actions/{upload,download}-artifact@v4  (GitHub retired the v3 protocol the Gitea variant pins)
#   - release via `gh release create` against the GitHub API (the Gitea variant POSTs the Gitea API)
#   - explicit `tags: ['v*']` trigger (GitHub does not inherit act_runner's tag/path-filter behavior)
#   - the internal UniTrack ingest step is omitted (Gitea-only integration + secrets)
#   - ktlintCheck fails its step directly; the Gitea routine lane must defer it to a final
#     verdict step because its executor rejects step-level `if:` (see that file). Same effect.
#   - no `changes` job: it exists on Gitea only, to restore the `paths-ignore` filtering
#     act_runner does not honor, and GitHub applies natively above. It runs there on `act-ci`,
#     a Gitea-only runner label with no GitHub equivalent — GitHub-hosted `ubuntu-latest` is
#     not tier2's shared pool and has none of that pool's Docker problem.
#   - no `corpus` job: the corpus lane is Gitea-only (it needs the pinned out-of-repo fixtures
#     the lunar-ci job image provisions).
#
# The env-fragile :integrationTest (real GoLand via IDE-Starter) and parser/lexer regeneration are
# NOT run here — same as the Gitea variant.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive build version
        id: version
        # On a v* tag the tag IS the release version (v1.2.3 -> 1.2.3); otherwise keep the
        # gradle.properties value (…-SNAPSHOT) unchanged.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -E '^pluginVersion' gradle.properties | sed -E 's/.*= *//')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle + IntelliJ Platform artifacts
        uses: actions/cache@v4
        with:
          # ~/.gradle holds the (large, ~1GB) downloaded GoLand platform + dependencies.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Provision headless test environment (fonts + Lua toolchain)
        # fontconfig + a font are REQUIRED: any test that inits an editor color scheme throws
        # "Fontconfig head is null" without them. lua5.4 + lua-socket back TestLuaDebugHarness /
        # rockspec-runtime tests, which exec ~/bin/lua and open a DBGp TCP socket.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            fontconfig fonts-dejavu-core lua5.4 lua-socket
          fc-cache -f || true
          mkdir -p "$HOME/bin"
          ln -sf "$(command -v lua5.4)" "$HOME/bin/lua"
          "$HOME/bin/lua" -v

      - name: Build plugin (compile + verifyPlugin + distributable zip)
        run: ./gradlew buildPlugin --no-daemon --stacktrace -PpluginVersion=${{ steps.version.outputs.version }}

      - name: Unit tests (excludes :integrationTest and out-of-repo fixture tests)
        # `test` does not trigger :integrationTest (a separate task). -PexcludeExternalFixtureTests
        # skips the two tests that read the out-of-repo test/ fixture tree, which a CI checkout lacks.
        #
        # --rerun: the SUITE MUST ACTUALLY EXECUTE. The actions/cache step above restores
        # ~/.gradle/caches, and with it Gradle's build cache — so on unchanged inputs `:test`
        # is served FROM-CACHE and this job reports a full pass having run nothing. Measured
        # on the Gitea lane, where a run "passed" 2375 tests in 78s doing exactly that.
        #
        # It matters more here than anywhere: this job feeds the `release` job below, so a
        # cache-served suite would publish a GitHub Release on tests that never ran.
        #
        # In principle caching is sound — identical inputs, identical result. In practice
        # several of this suite's inputs are NOT declared to Gradle: sandbox.home,
        # path.to.build.plugin, the out-of-repo test/ fixture tree, and ~/bin/lua. The cache
        # key can match while the environment differs.
        #
        # Scoped to this task rather than --no-build-cache, which would also stop compile
        # being served from cache — the thing the actions/cache step exists to make fast.
        run: ./gradlew test --rerun --no-daemon --stacktrace -PpluginVersion=${{ steps.version.outputs.version }} -PexcludeExternalFixtureTests

      # The formatting gate (BUG-445). ktlintCheck ALONE — never `ktlintFormat ktlintCheck`:
      # the format pass rewrites the very files the check then reads, so that pairing CANNOT
      # FAIL. That pairing is what AGENTS.md prescribed for the local gate, and it is how 13
      # files reached main unformatted while the gate reported green.
      #
      # Placed after the suite rather than before it so a formatting failure costs no test
      # diagnostics: "Upload test reports" is `if: always()` and still runs, while the
      # `if: success()` on the plugin upload below drops — so an unformatted tree cannot be
      # published and `release` (needs: build) never starts.
      #
      # The Gitea variant records this failure to a file and reports it in a final verdict
      # step instead. That is forced, not a difference in meaning: its routine lane runs on an
      # executor with no step-level `if:`, where a failing step aborts the job script outright.
      # Both platforms fail the job when, and only when, ktlintCheck fails.
      - name: Lint (ktlintCheck)
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  # Publishes a GitHub Release on a v* tag push. `needs: build` gates it on a green build+test, and
  # it reuses the EXACT zip the build tested (download-artifact) rather than rebuilding — so the
  # released bytes are what the suite validated. Marketplace publish (publishPlugin) stays dormant.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # for CHANGELOG.md

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download the tested plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: lunar-plugin
          path: dist

      - name: Locate the distributable zip
        id: zip
        run: |
          ZIP="$(find dist -name 'lunar-*.zip' | head -1)"
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::no plugin zip found in the downloaded artifact"; ls -lR dist || true; exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Release asset: $ZIP"

      - name: Extract release notes from CHANGELOG.md
        # Grab the body of the top-most "## [..]" section (whatever it's labelled) — tag-agnostic.
        run: |
          awk '
            /^## \[/ { if (seen) exit; seen=1; next }
            seen { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${{ steps.version.outputs.version }}" > release-notes.md
          fi
          echo "---- release notes ----"; cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "${{ steps.zip.outputs.path }}" \
            --title "Lunar ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
