# REFACT-01 design section 7 - the rename processor's refusals. Each one exists because the only
# alternative is a half-applied rename (BUG-457), so each names the reason rather than aborting.
# Quoting is MessageFormat-sensitive: BundleBase only formats when params are passed
# (BundleBase.kt:224), so a doubled '' is literal in a zero-argument message and single in a
# parameterised one.
refactoring.rename.unresolved=Cannot determine which declaration this name refers to, so its usages cannot be rewritten.
refactoring.rename.rewriteUnavailable=Rename was not applied: ''{0}'' cannot be written as a Lua identifier, so the declaration and its usages cannot be rewritten together.
refactoring.rename.unsupportedTarget=Rename is not supported for this Lua element.
refactoring.rename.functionNameSegment=''{0}'' is the receiver part of a function name, not the function''s own name. Renaming it would change this declaration and leave every ''{0}....'' call site bound to the old name.
refactoring.rename.colonMethod=Renaming a 'function Obj:method()' declaration is not supported yet: calls written 'obj:method()' are not resolved, so they would be left bound to the old name.

# REFACT-09 design section 7.2 - one key per member spelling LuaColonMethodRename.Spelling
# enumerates, rendered by LuaRenameConflictDetector's METHOD_FUNCTION arm. The rename rewrites the
# call sites NAV-13 binds; each key names an occurrence of the same member that it will leave on the
# old name, so a partial rename is answered for rather than reported as a success (BUG-457 class).
refactoring.rename.colonMethod.undecidedCall=This call to ''{0}'' cannot be bound to a declaration, so it may be a call of this method and will not be renamed.
refactoring.rename.colonMethod.dottedSpelling=This names the same member as ''{0}'' in the dotted form, which this rename does not rewrite.
refactoring.rename.colonMethod.bracketSpelling=This names the same member as ''{0}'' through a string key, which this rename does not rewrite.
refactoring.rename.colonMethod.fieldKey=This table-constructor key declares the same member as ''{0}'', which this rename does not rewrite.
refactoring.rename.conflict.capture=Renaming to ''{0}'' would bind a usage of ''{1}'' to a different declaration that is already visible here.
refactoring.rename.conflict.shadow=The renamed declaration would shadow this existing reference, changing which value it reads.
refactoring.rename.conflict.globalExists=A global named ''{0}'' already exists in this project; renaming would merge the two.
refactoring.rename.conflict.ambiguousGlobal=''{0}'' is declared in {1} places; while more than one declaration exists its usages do not resolve, so they will not be rewritten.

# REFACT-04 design section 7 - the label rename's conflict check (REFACT-04-07, -08). The severity
# is tiered by the configured language level, not by two mechanisms: the platform's rename pipeline
# has exactly one conflict surface, so the wording carries what would otherwise be a severity flag.
refactoring.rename.label.conflict.duplicate=Renaming this label to ''{0}'' duplicates the label declared on line {1}. Lua 5.4 and later reject the file with "label ''{0}'' already defined"; this project is configured for {2}.
refactoring.rename.label.conflict.rebind=Renaming this label to ''{0}'' makes it shadow the label declared on line {1}: any ''goto {0}'' between them will jump to the nearer label instead, changing what the program does. This project is configured for {2}, which allows it.
refactoring.rename.label.unresolvedGoto=''goto {0}'' does not refer to any label visible from here, so there is nothing to rename.
refactoring.rename.catsBuiltinType=''{0}'' is a LuaCATS builtin type name, so every use of it is parsed as the builtin and not as a reference to this declaration. Renaming it would move this tag and leave every use bound to the old name.
refactoring.rename.catsLibraryType=''{0}'' is also declared outside this project, in ''{1}''. Renaming it here would leave that declaration on the old name and split one type into two, so the rename is declined.
refactoring.rename.catsUnresolvedType=No ''@class'' or ''@alias'' declaring ''{0}'' was found in this project, so its uses cannot be rewritten.
refactoring.rename.conflict.catsTypeExists=A LuaCATS type named ''{0}'' is already declared in this project; renaming would merge the two.

